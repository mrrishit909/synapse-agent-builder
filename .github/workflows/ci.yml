name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: synapse, POSTGRES_USER: synapse, POSTGRES_PASSWORD: owner-dev-only }
        ports: ["55440:5432"]
        options: --health-cmd "pg_isready -U synapse" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc -p . && (cd apps/web && npx tsc --noEmit -p .)
      - run: node data/simulators/generate.ts
      - run: npx vitest run --coverage   # fails under 85% line coverage of domain logic
      - run: npx playwright install --with-deps chrome && npm run build -w @synapse/web && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright, path: test-results }
